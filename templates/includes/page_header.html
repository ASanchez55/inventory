<div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">
    <div>
        {% if kicker %}
        <p class="text-uppercase small fw-semibold text-primary mb-2">{{ kicker }}</p>
        {% endif %}
        <h2 class="h3 mb-1">{{ title }}</h2>
        {% if description %}
        <p class="text-secondary mb-0">{{ description }}</p>
        {% endif %}
    </div>
    {% if action_url and action_label %}
    <a href="{{ action_url }}" class="{{ action_class|default:'btn btn-primary rounded-pill px-4' }}">{{ action_label }}</a>
    {% endif %}
</div>
